{% extends "base.html" %}
{% block title %}Grade · 追求卓越{% endblock %}
{% block content %}
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-rise" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 7-8M14 7h6v6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1c5-5 8 4 15 0v10c-7 4-10-5-15 0"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></symbol>
  <symbol id="i-score" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h3"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m2-14a3 3 0 0 1 0 6m4 8v-2a4 4 0 0 0-3-4"/></symbol>
  <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="m8.5 12.5-2 8 5.5-3 5.5 3-2-8"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6v15m0-15C9 3 5 4 3 5v14c3-1 6-1 9 2 3-3 6-3 9-2V5c-2-1-6-2-9 1Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7m-16 0v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</svg>
<header class="top">
  <div class="shell top-row">
    <button class="brand" data-view="overview" aria-label="Grade，返回总览"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-rise"/></svg></span><b>Grade</b></button>
    <nav class="nav" aria-label="主导航">
      <button data-view="overview" aria-current="page">学习总览</button>
      <button data-view="history">考试记录</button>
      <button data-view="subjects">能力分析</button>
      <button data-view="week">练习</button>
      <button data-view="account">设置</button>
    </nav>
    <div class="mode-wrap">
      <button class="mode" id="mode-button" aria-controls="mode-menu" aria-expanded="false"><span id="mode-label">我的记录</span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>
      <div class="mode-menu" id="mode-menu" hidden><button data-mode="demo">演示数据</button><button data-mode="personal">我的记录</button></div>
    </div>
  </div>
</header>
<main class="shell">
  <section class="hero" aria-labelledby="hero-title">
    <div>
      <h1 id="hero-title">成绩记录</h1>
      <p class="hero-goal"><svg class="icon" aria-hidden="true"><use href="#i-flag"/></svg><span id="hero-goal">阶段目标 · 尚未设置</span></p>
    </div>
    <div class="identity-chip" id="identity-label" aria-label="当前账号"></div>
  </section>
  <div class="note mode-banner" id="mode-banner" hidden></div>
  <div id="content"><div class="empty">正在加载…</div></div>
  <footer class="footer"><span>Grade</span><span id="footer-note"></span></footer>
</main>
<nav class="nav mobile-nav" aria-label="手机导航">
  <button data-view="overview"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>首页</button>
  <button data-view="history"><svg class="icon" aria-hidden="true"><use href="#i-score"/></svg>考试</button>
  <button data-view="subjects"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>能力</button>
  <button data-view="week"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>练习</button>
  <button data-view="account" aria-label="设置，当前账号"><svg class="icon" aria-hidden="true"><use href="#i-people"/></svg>设置</button>
</nav>
<div class="panel-layer" id="panel-layer" hidden>
  <section class="panel panel-page" id="exam-dialog" role="dialog" aria-modal="true" aria-labelledby="exam-dialog-title" tabindex="-1" hidden><div class="dialog-inner" id="exam-form-content"></div></section>
  <section class="panel" id="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1" hidden><div class="dialog-inner" id="detail-form-content"></div></section>
  <section class="panel" id="score-dialog" role="dialog" aria-modal="true" aria-labelledby="score-dialog-title" tabindex="-1" hidden><div class="dialog-inner" id="score-dialog-content"></div></section>
  <div class="exam-picker-layer" id="exam-picker-layer" hidden>
    <section class="panel exam-picker-sheet" id="exam-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="exam-picker-title" tabindex="-1" hidden>
      <div class="exam-picker-grip" aria-hidden="true"></div>
      <header class="exam-picker-header"><h2 id="exam-picker-title"></h2><button type="button" data-action="close-exam-picker">取消</button></header>
      <div class="ios-group" id="exam-picker-options" role="group" aria-labelledby="exam-picker-title"></div>
      <button class="exam-picker-clear" type="button" data-exam-choice="" hidden>清除选择</button>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
